server.port=8083

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:careerlens_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (enabled only for local development convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# DeepSeek integration (optional). Set api key in environment or here.
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=
deepseek.model=deepseek-chat

# Live internship feed configuration
internship.feed.refresh.ms=1800000
internship.feed.limit=60
internship.feed.remotive.url=https://remotive.com/api/remote-jobs?search=intern
internship.feed.arbeitnow.url=https://www.arbeitnow.com/api/job-board-api
internship.feed.unstop.url=
internship.feed.unstop.api.key=